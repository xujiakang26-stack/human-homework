interface:
  display_name: "人类写作业"
  short_description: "本机真实运行截图，宋体小四朴素报告，只交报告与题目要求完成的文件"
  default_prompt: "使用 $human-homework，先读本次作业及相关材料并集中对齐必要问题，复用已有环境和有效结果，真实完成必做实验与截图；不重复检查或重跑，修改后只检查受影响部分。报告用宋体小四、多截图少文字、不加图号、每段末尾去掉句号，只将一份报告和题目要求完成的文件放入根目录的 00_作业N提交 文件夹，报告按姓名_学号_作业N命名，完成一次必要核对后给我文件夹与最新文件链接。"
policy:
  allow_implicit_invocation: true
